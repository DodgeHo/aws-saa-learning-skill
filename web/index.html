<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="认证题库练习，支持 SAA / SAP / ISPM 多题库刷题与学习进度追踪。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="题库练习">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>题库练习</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var map = {
        saa: 'SAA 练习',
        sap: 'SAP 练习',
        ispm: 'ISPM 练习'
      };
      fetch('assets/active_bank.txt', { cache: 'no-store' })
        .then(function (res) { return res.text(); })
        .then(function (txt) {
          var bank = (txt || '').trim().toLowerCase();
          var title = map[bank] || '题库练习';
          document.title = title;

          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) {
            appleTitle.setAttribute('content', title);
          }
        })
        .catch(function () {
          // Keep default title on fetch failure.
        });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swUrl = new URL('sw.js', document.baseURI).toString();
        navigator.serviceWorker.register(swUrl).catch((err) => {
          console.warn('Service Worker 注册失败:', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
